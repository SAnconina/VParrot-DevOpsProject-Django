services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vparrot
      POSTGRES_USER: vparrot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vparrot -d vparrot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: "vparrot.settings"
      DATABASE_URL: postgres://vparrot:${POSTGRES_PASSWORD}@db:5432/vparrot
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data: